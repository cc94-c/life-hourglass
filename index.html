<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生沙漏 · 完整交互原型</title>
<style>
:root{
  --cream:#F9F5ED; --surface:#FFFDF9; --soft:#F0E4D4; --soft2:#F5ECDF; --soft3:#FBF4E7;
  --line:#EADFD0; --line2:#F1E8DB;
  --ink:#503B2F; --ink2:#6B5647; --ink3:#7E6B5B; --ink4:#7F6B5A;
  --brand:#85552F; --brand2:#6B4224; --gold:#CB9A62; --gold2:#E3C9A5;
  --sh1:0 1px 2px rgba(80,59,47,.04);
  --sh2:0 12px 26px -20px rgba(80,59,47,.7);
  --ease:cubic-bezier(.22,.9,.24,1);
  --spring:cubic-bezier(.16,1,.3,1);
  --serif:Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);
  background:radial-gradient(1200px 600px at 50% -10%,#FBF1E2 0%,#F2E6D6 45%,#EADDCB 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:26px 16px;gap:14px;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{font-size:12.5px;line-height:1.85;color:#8A7059;text-align:center;max-width:520px}
.cap b{color:#6B4224;font-weight:600}
.cap kbd{font-family:var(--sans);font-size:11px;background:#FFFDF9;border:1px solid #E3D5C2;
  border-radius:6px;padding:1px 6px;color:#6B4224}

/* ---------- 设备 ---------- */
.device{
  width:390px;height:844px;border-radius:52px;background:#2C1F16;padding:9px;
  box-shadow:0 40px 80px -30px rgba(60,40,25,.55),0 2px 0 rgba(255,255,255,.35) inset,
             0 0 0 1px rgba(255,255,255,.14);
  position:relative;flex:0 0 auto;
}
.screen{
  width:100%;height:100%;border-radius:44px;overflow:hidden;position:relative;
  background:var(--cream);display:flex;flex-direction:column;isolation:isolate;font-size:15px;
}
.statusbar{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:11px 26px 0;font-size:14px;font-weight:600;color:var(--ink);
  position:relative;z-index:30;pointer-events:none;flex:0 0 44px}
.sb-r{display:flex;align-items:center;gap:5px}
.home-ind{position:absolute;left:50%;transform:translateX(-50%);bottom:7px;width:134px;height:5px;
  border-radius:3px;background:#3A2A1E;opacity:.28;z-index:40;pointer-events:none}

/* ---------- 页面栈 ---------- */
.vp{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .28s var(--ease);
  transform:translateX(16px);will-change:transform,opacity}
.page.on{opacity:1;pointer-events:auto;transform:none;z-index:3}
.page.back{transform:translateX(-10px)}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:2px 20px 26px;
  scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),rgba(0,0,0,.05) 100%);
          mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),rgba(0,0,0,.05) 100%)}
.scroll::-webkit-scrollbar{display:none}
.nomask{-webkit-mask-image:none;mask-image:none}
.scroll.nomask{display:flex;flex-direction:column}

/* ---------- 页头 ---------- */
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:2px}
.phead h1{margin:0;font-family:var(--serif);font-size:24px;line-height:1.2;font-weight:600;
  letter-spacing:.02em}
.phead p{margin:3px 0 0;font-size:11.5px;line-height:1.4;color:var(--ink3)}
.iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--brand);display:grid;place-items:center;
  transition:transform .16s var(--ease),background .16s}
.iconbtn:active{transform:scale(.9);background:var(--soft)}
.hbar{flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:4px 20px 0;position:relative;z-index:8}
.hbar h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em;
  flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .txt{font-size:13px;color:var(--brand);font-family:inherit;font-weight:600;
  background:none;border:0;padding:8px 2px;white-space:nowrap}
.hbar .txt:active{opacity:.6}

/* ---------- 双沙漏主视觉 ---------- */
.duo{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:2px;min-height:198px}
.hcard{border:0;background:transparent;font-family:inherit;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;cursor:pointer;
  transition:width .5s var(--spring),flex-basis .5s var(--spring),padding .5s var(--spring),
    background .35s,border-color .35s,box-shadow .35s,transform .3s var(--ease)}
.hcard:active{transform:scale(.97)}
.hcard.main{flex:1 1 auto;min-width:0}
.hcard.main .hg{width:124px;height:147px;animation:flip 18s var(--ease) infinite}
.hcard .num{display:flex;align-items:baseline;flex-wrap:nowrap;white-space:nowrap}
.hcard .num em{white-space:nowrap}
.hcard.main .num{font-family:var(--serif);font-size:43px;line-height:1.06;font-weight:600;
  color:#7A4A26;letter-spacing:-.015em;font-variant-numeric:tabular-nums;gap:3px;margin-top:1px}
.hcard.main .num em{font-style:normal;font-size:14px;font-weight:500;color:var(--ink2);margin-left:1px}
.hcard.main .lab{font-size:11px;letter-spacing:.16em;color:var(--ink3);padding-left:.16em}
.hcard.side{flex:0 0 84px;width:84px;min-width:0;padding:9px 4px 8px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1)}
.hcard.side .hg{width:42px;height:50px;animation:flip 18s var(--ease) infinite}
.hcard.side .num{font-family:var(--serif);font-size:16px;line-height:1.1;font-weight:600;
  color:var(--brand2);font-variant-numeric:tabular-nums;gap:2px;margin-top:2px}
.hcard.side .num em{font-style:normal;font-size:9.5px;color:var(--ink2);font-weight:500}
.hcard.side .lab{font-size:9.5px;color:var(--ink3);margin-bottom:1px;letter-spacing:.02em}
.duo-hint{margin:0 0 0;text-align:center;font-size:10.5px;color:var(--ink4);letter-spacing:.02em}
.hourglass{display:block;transform-style:preserve-3d}
.hg .sand-top{transform-origin:80px 100px;animation:drain 18s linear infinite}
.hg .sand-bot{transform-origin:80px 168px;animation:fill 18s linear infinite}
.hg .stream{animation:flow 1.1s linear infinite}
@keyframes flip{0%,90%{transform:rotateY(0)}95%{transform:rotateY(180deg)}96%,100%{transform:rotateY(360deg)}}
@keyframes drain{0%{transform:scaleY(1)}90%{transform:scaleY(.05)}91%,100%{transform:scaleY(1)}}
@keyframes fill{0%{transform:scaleY(.55)}90%{transform:scaleY(1)}91%,100%{transform:scaleY(.55)}}
@keyframes flow{to{stroke-dashoffset:-26}}
.mini-g{display:inline-block;flex:0 0 auto;vertical-align:-2px}

/* ---------- chips ---------- */
.chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:2px 0 2px;margin:0 -20px;padding-left:20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:999px;
  border:1px solid transparent;background:var(--soft);color:var(--ink2);font-size:12.5px;
  font-family:inherit;white-space:nowrap;flex:0 0 auto;
  transition:transform .16s var(--ease),background .18s,color .18s}
.chip:active{transform:scale(.95)}
.chip.is-on{background:var(--brand);color:#FFF9F0;font-weight:500}
.chip.ghost{background:transparent;border-color:var(--line);color:var(--ink2)}
.chip b{font-weight:600;font-size:12px}
.stage-chips{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-2px}

/* ---------- 事件卡 ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:12px 0 8px}
.sec h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.sec h2 small{font-family:var(--sans);font-size:11px;color:var(--ink3);font-weight:400;margin-left:6px;
  letter-spacing:0}
.sec a{font-size:11.5px;color:var(--brand);text-decoration:none;font-weight:500;
  display:flex;align-items:center;gap:2px}
.evlist{display:flex;flex-direction:column;gap:9px}
.ev{position:relative;display:block;width:100%;text-align:left;font-family:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px 11px;
  color:var(--ink);box-shadow:var(--sh1);
  transition:transform .15s var(--ease),background .3s,border-color .3s}
.ev:active{transform:scale(.982)}
.ev-top{display:flex;align-items:flex-start;gap:10px}
.ev-ic{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--soft2);
  display:grid;place-items:center;color:var(--brand)}
.ev-mid{flex:1;min-width:0;padding-top:1px}
.ev-t{margin:0;font-size:14px;font-weight:600;line-height:1.35;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-s{margin:2px 0 0;font-size:11px;color:var(--ink3);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-r{flex:0 0 auto;display:flex;align-items:baseline;gap:3px;padding-top:1px;white-space:nowrap}
.ev-r b{font-family:var(--serif);font-size:19px;line-height:1.1;font-weight:600;
  color:var(--brand2);font-variant-numeric:tabular-nums}
.ev-r i{font-style:normal;font-size:10px;color:var(--ink3)}
.ev-foot{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--line2)}
.ev-foot .g{opacity:.6;color:var(--brand)}
.ev-foot span{font-size:11px;color:var(--ink3);line-height:1.3}
.ev-foot .right{margin-left:auto;display:flex;align-items:center;gap:5px}
.ev.done .ev-t{color:var(--ink2)}
.ev.done .ev-r b{color:var(--ink4)}
.pbar{height:5px;border-radius:3px;background:#E4D2BC;overflow:hidden;flex:0 0 64px;margin-bottom:1px}
.pbar i{display:block;height:100%;border-radius:2px;background:var(--brand);
  transform-origin:left;animation:grow .7s var(--spring) both}
@keyframes grow{from{transform:scaleX(0)}}

/* 空态卡 */
.ev.empty{background:transparent;border:1px dashed #DCC9B2;box-shadow:none;padding:14px 14px}
.ev.empty .ev-ic{background:transparent;border:1px solid var(--line);color:var(--ink4)}
.ev.empty .ev-t{color:var(--ink2);font-weight:500}
.ev.empty .ev-s{color:var(--ink4)}
.ev.empty .plus{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--brand);display:grid;place-items:center;align-self:center}
.ev.empty:active .plus{background:var(--soft)}

/* 模块块（5 子功能入口） */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 1px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh1);color:var(--ink2);font-family:inherit;
  transition:transform .15s var(--ease),background .2s}
.tile:active{transform:scale(.94);background:var(--soft2)}
.tile .ti{color:var(--brand);line-height:0}
.tile .tl{font-size:10px;white-space:nowrap;letter-spacing:0;line-height:1}
.tile .tn{position:absolute;top:5px;right:7px;font-size:9.5px;color:var(--ink4);line-height:1}
.tile.live .tl{color:var(--ink3)}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mod{position:relative;text-align:left;font-family:inherit;min-height:104px;padding:12px 13px 10px;
  border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  box-shadow:var(--sh1);display:flex;flex-direction:column;
  transition:transform .15s var(--ease),background .2s}
.mod:active{transform:scale(.972);background:var(--soft2)}
.mod .mh{display:flex;align-items:center;justify-content:space-between}
.mod h3{margin:0;font-family:var(--serif);font-size:15.5px;font-weight:600}
.mod .n{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brand2);
  margin:9px 0 0;line-height:1;font-variant-numeric:tabular-nums}
.mod .n em{font-style:normal;font-size:10.5px;color:var(--ink3);font-family:var(--sans);margin-left:2px}
.mod .d{margin:5px 0 0;font-size:10.5px;color:var(--ink3);line-height:1.4}
.mod .corner{position:absolute;right:12px;bottom:10px;opacity:.5;color:var(--brand)}

/* ---------- 底部导航 ---------- */
.tabbar{flex:0 0 78px;height:78px;background:rgba(255,253,249,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  align-items:start;padding:8px 4px 0;position:relative;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
  font-family:inherit;color:var(--ink3);padding:3px 0 0;border-radius:12px;
  transition:color .18s,transform .16s var(--ease)}
.tab:active{transform:scale(.92)}
.tab .lbl{font-size:10.5px;letter-spacing:.01em}
.tab .dot{width:4px;height:4px;border-radius:50%;background:var(--brand);opacity:0;
  transform:scale(.3);transition:.24s var(--spring);order:3;margin-top:2px}
.tab.is-on{color:var(--brand)}
.tab.is-on .dot{opacity:1;transform:none}
.tab-fab{position:relative;padding-top:0;justify-content:flex-start}
.tab-fab .sq{position:absolute;left:50%;top:-20px;transform:translateX(-50%);
  width:50px;height:50px;border-radius:16px;background:var(--brand2);color:#FFF7EA;
  display:grid;place-items:center;box-shadow:0 10px 20px -10px rgba(78,44,21,.65),0 0 0 5px var(--cream);
  transition:transform .18s var(--ease),top .2s}
.tab-fab:active .sq{transform:translateX(-50%) scale(.92)}
.tab-fab .lbl{margin-top:33px}

/* ---------- 弹层 ---------- */
.scrim{position:absolute;inset:0;background:rgba(60,40,26,.34);opacity:0;pointer-events:none;
  transition:opacity .26s;z-index:24;backdrop-filter:blur(1px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:26;background:var(--cream);
  border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .42s var(--spring);
  max-height:88%;display:flex;flex-direction:column;
  box-shadow:0 -14px 40px -20px rgba(60,40,25,.4)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:#DCCBB6;margin:9px auto 2px;flex:0 0 auto}
.sh-body{overflow-y:auto;padding:6px 20px 26px;scrollbar-width:none}
.sh-body::-webkit-scrollbar{display:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.sh-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.sh-head p{margin:2px 0 0;font-size:11.5px;color:var(--ink3)}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;
  padding:13px 4px;background:none;border:0;border-bottom:1px solid var(--line2);color:var(--ink)}
.opt:last-child{border-bottom:0}
.opt .oi{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:var(--soft2);
  display:grid;place-items:center;color:var(--brand)}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:14px;font-weight:500}
.opt .ot small{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.opt .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid #D9C7B2;flex:0 0 20px;
  display:grid;place-items:center;color:#FFF9F0;transition:.2s}
.opt.is-sel .tick{background:var(--brand);border-color:var(--brand)}
.opt:active{background:var(--soft2)}
.field{margin-bottom:12px}
.flabel{display:block;font-size:11.5px;color:var(--ink3);margin:0 0 6px;letter-spacing:.02em}
.input{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface);
  padding:0 14px;font-family:inherit;font-size:14px;color:var(--ink);display:flex;align-items:center}
.input::placeholder{color:var(--ink4)}
.input:focus{outline:2px solid rgba(133,85,47,.35);outline-offset:-1px;border-color:var(--brand)}
textarea.input{height:72px;padding:12px 14px;line-height:1.5;resize:none}
.btn{width:100%;height:50px;border-radius:14px;border:0;font-family:inherit;font-size:15px;
  font-weight:600;background:var(--brand);color:#FFF9F0;margin-top:8px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .14s var(--ease),opacity .2s}
.btn:active{transform:scale(.982)}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line);font-weight:500}
.btn.sm{height:42px;font-size:13.5px;margin-top:0}

/* ---------- 社区 ---------- */
.seg{display:flex;gap:4px;background:var(--soft2);border-radius:12px;padding:3px;margin-top:2px}
.seg button{flex:1;height:34px;border:0;background:none;border-radius:9px;font-family:inherit;
  font-size:13px;color:var(--ink2);transition:.2s}
.seg button.is-on{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(80,59,47,.1)}
.topic-strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:10px -20px 0;
  padding:0 20px 2px}
.topic-strip::-webkit-scrollbar{display:none}
.tp{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:12px;color:var(--ink2);font-family:inherit;
  transition:transform .16s var(--ease)}
.tp:active{transform:scale(.95)}
.tp b{color:var(--brand);font-weight:600}
.posts{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px 11px;
  box-shadow:var(--sh1);text-align:left;font-family:inherit;width:100%;color:var(--ink);
  display:block;transition:transform .15s var(--ease)}
.post:active{transform:scale(.985)}
.p-author{display:flex;align-items:center;gap:9px}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:14px;font-weight:600;color:#fff;
  background:linear-gradient(150deg,#B9885A,#8A5B33)}
.av.b{background:linear-gradient(150deg,#9C8B6E,#6E6350)}
.av.c{background:linear-gradient(150deg,#C09A6B,#A5764A)}
.av.d{background:linear-gradient(150deg,#8E7A66,#6A5949)}
.p-author .who{flex:1;min-width:0}
.p-author .who b{display:block;font-size:13px;font-weight:500;line-height:1.3}
.p-author .who small{font-size:10.5px;color:var(--ink4)}
.follow{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-family:inherit;font-size:11.5px;color:var(--brand);font-weight:500}
.follow.is-on{border-color:transparent;background:var(--soft);color:var(--ink2)}
.p-evt{display:flex;align-items:center;gap:6px;margin-top:10px;padding:6px 9px;border-radius:10px;
  background:var(--soft3);border:1px solid var(--line2);font-size:11px;color:var(--ink2)}
.p-evt b{font-weight:500;color:var(--brand2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-evt .r{margin-left:auto;color:var(--ink4);font-size:10.5px;flex:0 0 auto}
.p-txt{margin:9px 0 0;font-size:13.5px;line-height:1.62;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.p-txt.full{-webkit-line-clamp:unset}
.p-mood{margin:9px 0 0;position:relative;padding:9px 12px 9px 13px;border-radius:10px;
  background:var(--soft3);font-size:13px;line-height:1.62;color:var(--ink2)}
.p-mood:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;
  border-radius:1px;background:var(--gold)}
.p-media{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
.p-media i{height:64px;border-radius:9px;background:linear-gradient(140deg,#EFE0C9,#E2CDAF);
  display:block}
.p-media.two i:first-child{grid-column:span 2}
.p-foot{display:flex;align-items:center;gap:16px;margin-top:11px;padding-top:9px;
  border-top:1px solid var(--line2)}
.p-foot button{display:flex;align-items:center;gap:5px;background:none;border:0;font-family:inherit;
  font-size:11.5px;color:var(--ink3);padding:2px 0;transition:color .18s,transform .14s var(--ease)}
.p-foot button:active{transform:scale(.9)}
.p-foot button.liked{color:#B4553A}
.p-foot .tag{margin-left:auto;font-size:10.5px;color:var(--ink4)}

/* 话题页 */
.tp-hero{border-radius:18px;padding:15px 15px 13px;background:var(--soft);
  border:1px solid transparent;margin-top:2px}
.tp-hero h1{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.01em}
.tp-hero h1 span{color:var(--brand)}
.tp-hero p{margin:6px 0 0;font-size:12px;line-height:1.6;color:var(--ink2)}
.tp-stat{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--ink3)}
.tp-stat b{color:var(--ink);font-weight:600}

/* 帖子详情 */
.pd{padding:0 0 2px}
.pd-main{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:15px 15px 12px;margin-top:2px}
.pd-main .p-txt{font-size:14px;line-height:1.72;-webkit-line-clamp:unset}
.cmt-title{display:flex;align-items:center;justify-content:space-between;margin:16px 0 9px}
.cmt-title h3{margin:0;font-family:var(--serif);font-size:15px;font-weight:600}
.cmt-title span{font-size:11px;color:var(--ink3)}
.cmt{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line2)}
.cmt:last-child{border-bottom:0}
.cmt .av{width:28px;height:28px;flex:0 0 28px;font-size:12px}
.cmt-b{flex:1;min-width:0}
.cmt-b .who{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cmt-b .who b{font-size:12px;font-weight:500;color:var(--ink2)}
.cmt-b .who small{font-size:10px;color:var(--ink4)}
.cmt-b p{margin:0;font-size:13px;line-height:1.6;color:var(--ink)}
.cmt-b .rep{margin-top:5px;font-size:10.5px;color:var(--ink3);display:flex;gap:12px}
.cmt-like{background:none;border:0;font-family:inherit;font-size:10.5px;color:var(--ink4);
  display:flex;align-items:center;gap:3px;padding:2px 0;flex:0 0 auto;align-self:flex-start}
.cmt-like.liked{color:#B4553A}
.cmt-in{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:9px 20px 12px;
  border-top:1px solid var(--line);background:var(--surface);
  box-shadow:0 -10px 20px -14px rgba(80,59,47,.35);position:relative;z-index:4}
.cmt-in .input{height:40px;border-radius:20px;font-size:13px;flex:1}
.send{width:58px;height:38px;border-radius:19px;border:0;background:var(--brand);color:#FFF9F0;
  font-family:inherit;font-size:13px;font-weight:600;flex:0 0 58px}
.send:disabled{opacity:.35}

/* ---------- 引导页 ---------- */
.ob{flex:1;display:flex;flex-direction:column;padding:0 26px 26px}
.ob-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:#DCC9B2;transition:.3s var(--spring)}
.dots i.on{width:20px;border-radius:3px;background:var(--brand)}
.ob-skip{background:none;border:0;font-family:inherit;font-size:12.5px;color:var(--ink3);padding:6px}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:22px}
.ob-k{font-size:11px;letter-spacing:.2em;color:var(--ink4);margin:0 0 10px}
.ob-h{margin:0;font-family:var(--serif);font-size:27px;line-height:1.34;font-weight:600;
  letter-spacing:.01em}
.ob-h em{font-style:normal;color:var(--brand)}
.ob-d{margin:11px 0 0;font-size:13px;line-height:1.75;color:var(--ink2)}
.ob-hero{display:grid;place-items:center;margin:6px 0 18px}
.ob-hero .hg{width:112px;height:133px;animation:flip 18s var(--ease) infinite}
.ob-foot{flex:0 0 auto}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--brand) var(--p,40%),#E5D6C2 var(--p,40%));outline:none;margin:16px 0 6px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#FFFDF9;border:2px solid var(--brand);box-shadow:0 2px 6px rgba(80,59,47,.2)}
.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#FFFDF9;
  border:2px solid var(--brand)}
.rng-val{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--ink3)}
.rng-val b{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--brand2);
  font-variant-numeric:tabular-nums}
.rng-val b em{font-style:normal;font-size:13px;color:var(--ink2);font-family:var(--sans);margin-left:3px}
.wheel{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.wheel select{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--serif);font-size:17px;color:var(--ink);padding:0 10px;text-align:center;
  -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.ob-sum{border-radius:16px;background:var(--soft);padding:14px;margin-top:16px}
.ob-sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:12px}
.ob-sum dt{color:var(--ink2)}
.ob-sum dd{margin:0;text-align:right;color:var(--ink);font-weight:500}
.ob-sum .big{font-family:var(--serif);font-size:19px;color:var(--brand2)}

/* ---------- 我的 / 消息 ---------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 10px;
  text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--brand2);
  line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--ink3)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  margin-top:10px}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line2);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;
  text-align:left;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft2)}
.row .ri{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:var(--soft2);
  display:grid;place-items:center;color:var(--brand)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:13.5px;font-weight:500}
.row .rt small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.row .rv{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:3px}

/* 专注 */
.focus-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 26px 34px;min-height:0}
.focus-ring{position:relative;width:212px;height:212px;display:grid;place-items:center}
.focus-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.focus-time{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--brand2);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1}
.focus-time em{font-style:normal;font-size:15px;color:var(--ink3);font-family:var(--sans)}
.focus-lab{margin:8px 0 0;font-size:11.5px;color:var(--ink3);letter-spacing:.1em}
.focus-pick{display:flex;gap:7px;margin-top:22px}

/* 骨架/工具 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:rgba(64,44,30,.93);color:#FBF3E4;font-size:12.5px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.26s var(--ease);z-index:44;white-space:nowrap;
  max-width:86%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 24px -12px rgba(50,30,15,.7)}
.toast.on{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
html.rm *{animation-duration:.001s!important;animation-iteration-count:1!important;
  transition-duration:.06s!important}
</style>
</head>

/* ---------------- 类型 ---------------- */
const TYPES = {
  node:  {label:'人生节点', ic:'sparkle', one:'个'},
  count: {label:'倒计时',   ic:'timer',   one:'个'},
  anniv: {label:'纪念日',   ic:'heart',   one:'个'},
  goal:  {label:'目标',     ic:'target',  one:'个'},
  focus: {label:'专注',     ic:'atom',    one:'段'}
};
const ORDER = ['node','count','anniv','goal'];

/* ---------------- 状态 ---------------- */
const KEY='hourglass.v2';
const DEF = { birth:'1994-06-18', life:87, freeH:8, front:'life', lifeUnit:'天', freeUnit:'小时',
  events:[], seen:false, rm:false, follows:[], likes:[], cmts:{} };
let S = JSON.parse(JSON.stringify(DEF));
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); S=Object.assign(S,o); return !!o.seen; } }catch(e){}
  return false;
}

/* ---------------- 时间计算 ---------------- */
const DAY=864e5;
const today=(()=>{ const t=new Date(); t.setHours(0,0,0,0); return t; })();
const dOf = s => { const [y,m,dd]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,dd||1); };
const dayBetween = (a,b)=> Math.round((b-a)/DAY);

function calc(){
  const b=dOf(S.birth);
  const total=Math.round(S.life*365.2425);
  const used=Math.max(0, dayBetween(b,today));
  const left=Math.max(0, total-used);
  return {total,used,left,freeHours:left*S.freeH,age:Math.floor(used/365.2425)};
}

/* ---------------- 反馈 ---------------- */
let toastT=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2100);
  $('#srLive').textContent=msg;
}
function buzz(ms){ if(navigator.vibrate && !REDUCE()){ try{ navigator.vibrate(ms||8); }catch(e){} } }

/* ---------------- 视图：单事件 ---------------- */
function evView(e){
  const dt=dOf(e.date||'2026-01-01');
  if(e.type==='node'){
    const n=dayBetween(dt,today);
    if(n>0) return {main:fmt(n), unit:'天前', sub:dt.getFullYear()+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getDate()).padStart(2,'0'), foot:'这是已经走过的路', done:true};
    return {main:fmt(-n), unit:'天后', sub:'计划在 '+(dt.getFullYear())+' 年', foot:'还有 '+fmt(-n)+' 天到这一天', done:false};
  }
  if(e.type==='count'){
    const n=dayBetween(today,dt);
    if(n<0) return {main:fmt(-n), unit:'天前', sub:'已过期 · '+e.date, foot:'已经过去了', done:true};
    return {main:fmt(n), unit:'天', sub:'到 '+e.date, foot:'还剩 '+fmt(n)+' 天', done:false};
  }
  if(e.type==='anniv'){
    const n=dayBetween(dt,today);
    if(n>=0) return {main:fmt(n+1), unit:'天', sub:'从 '+e.date+' 起', foot:'第 '+fmt(n+1)+' 天，还在继续', done:false};
    return {main:fmt(-n), unit:'天后', sub:e.date+' · 每年提醒', foot:'距离下一次 '+-n+' 天', done:false};
  }
  if(e.type==='goal'){
    const cur=e.current||0, tar=Math.max(1,e.target||1);
    const p=Math.max(0,Math.min(1,cur/tar));
    return {main:Math.round(p*100), unit:'%', sub:'共 '+tar+(e.unit||'')+' · 截止 '+(e.date||'—'),
      foot:cur+' / '+tar+(e.unit||''), prog:p, done:p>=1};
  }
  return {main:'—',unit:'',sub:'',foot:'',done:false};
}

function evCard(e){
  const v=evView(e), T=TYPES[e.type];
  return `<button class="ev ${v.done?'done':''}" data-ev="${e.id}">
    <div class="ev-top">
      <span class="ev-ic">${icon(T.ic,16)}</span>
      <div class="ev-mid"><p class="ev-t">${esc(e.title)}</p><p class="ev-s">${esc(T.label)} · ${esc(v.sub)}</p></div>
      <div class="ev-r"><b>${v.main}</b><i>${v.unit}</i></div>
    </div>
    <div class="ev-foot">
      ${miniGlass(12)}<span>${esc(v.foot)}</span>
      ${v.prog!=null?`<span class="right"><span class="pbar"><i style="width:${(v.prog*100).toFixed(1)}%"></i></span><span>${Math.round(v.prog*100)}%</span></span>`:''}
    </div>
  </button>`;
}
function emptyCard(t){
  const hint={node:'记录一个已经发生或计划中的重要时刻',count:'给一件期待的事设个日子',anniv:'记住在一起、值得纪念的那天',goal:'给想达成的事一个进度条'}[t];
  return `<button class="ev empty" data-new="${t}">
    <div class="ev-top">
      <span class="ev-ic">${icon(TYPES[t].ic,15)}</span>
      <div class="ev-mid"><p class="ev-t">还没有${TYPES[t].label}</p><p class="ev-s">${hint}</p></div>
      <span class="plus">${icon('plus',14)}</span>
    </div>
  </button>`;
}

/* ---------------- 首页：双沙漏 ---------------- */
let heroBuilt=false;
function buildHero(){
  if(heroBuilt) return;
  $('#duo').innerHTML =
    `<button class="hcard" data-k="life" aria-label="人生剩余时间，点击切换单位">
       <span class="lab">人生还剩</span>
       <span class="num"><span class="v">—</span><em id="uLife">天</em></span>
       ${bigGlass('life')}
     </button>
     <button class="hcard" data-k="free" aria-label="可奋斗时间，点击切换主视图">
       <span class="lab">可奋斗</span>
       <span class="num"><span class="v">—</span><em id="uFree">小时</em></span>
       ${bigGlass('free')}
     </button>`;
  heroBuilt=true;
}

function fmtUnit(n,unit){
  if(unit==='年') return n.toFixed(1);
  if(unit==='月') return fmt(n);
  if(unit==='周') return fmt(n);
  return fmt(n);
}
const LIFE_UNITS=['天','周','月','年'];
const FREE_UNITS=['小时','天','年'];
function cycleUnit(k){
  if(k==='life'){ const i=LIFE_UNITS.indexOf(S.lifeUnit||'天'); S.lifeUnit=LIFE_UNITS[(i+1)%LIFE_UNITS.length]; toast('剩余时间按「'+S.lifeUnit+'」显示'); }
  else { const i=FREE_UNITS.indexOf(S.freeUnit||'小时'); S.freeUnit=FREE_UNITS[(i+1)%FREE_UNITS.length]; toast('可奋斗时间按「'+S.freeUnit+'」显示'); }
  save(); applyHero(); buzz(6);
}

function heroValue(which,c){
  if(which==='life'){
    const u=S.lifeUnit||'天';
    if(u==='周') return {v:fmt(c.left/7), u:'周'};
    if(u==='月') return {v:fmt(c.left/30.44), u:'月'};
    if(u==='年') return {v:(c.left/365.2425).toFixed(1), u:'年'};
    return {v:fmt(c.left), u:'天'};
  }else{
    const u=S.freeUnit||'小时';
    if(u==='天') return {v:fmt(c.freeHours/24), u:'天'};
    if(u==='年') return {v:(c.freeHours/8766).toFixed(1), u:'年'};
    return {v:fmt(c.freeHours), u:'小时'};
  }
}

function fillHero(){
  buildHero();
  const c=calc();
  $$('#duo .hcard').forEach(card=>{
    const k=card.dataset.k, o=heroValue(k,c);
    card.querySelector('.v').textContent=o.v;
    card.querySelector('em').textContent=o.u;
    const len=o.v.length;
    if(card.classList.contains('main')){
      card.querySelector('.num').style.fontSize = len>=7? '33px' : (len===6?'38px':'43px');
    }else{
      card.querySelector('.num').style.fontSize = len>=8?'12px':(len>=7?'13.5px':'16px');
    }
  });
}
function applyHero(){
  buildHero();
  const cards=$$('#duo .hcard');
  cards.forEach(card=>{
    const isMain = card.dataset.k===S.front;
    card.classList.toggle('main',isMain);
    card.classList.toggle('side',!isMain);
    card.style.order = isMain? '1':'2';
  });
  $('#duoHint').textContent = S.front==='life'
    ? '点右侧小沙漏，切换成「可奋斗时间」'
    : '点右侧小沙漏，切回「人生剩余」';
  fillHero();
}

/* ---------------- 首页：其余 ---------------- */
function renderHome(){
  const c=calc();
  $('#homeSub').textContent = c.age+' 岁 · 已走过 '+fmt(c.used)+' 天 · 每天可奋斗 '+S.freeH+' 小时';
  applyHero();

  $('#stageChips').innerHTML =
    `<button class="chip" id="stageBtn">当前阶段 <b>${c.age} 岁</b> ${icon('arrow',13)}</button>
     <button class="chip" id="timeBtn">${icon('atom',13)} 可奋斗 <b>${fmt(c.freeHours/1e4*1)}万</b> 小时 ${icon('arrow',13)}</button>`;

  const counts={}; ORDER.forEach(t=>counts[t]=S.events.filter(e=>e.type===t).length);
  const total=S.events.filter(e=>e.type!=='focus').length;
  $('#evCount').textContent = total+' 件';

  // 筛选（一个都没有时不必出现）
  if(!S.filter) S.filter='all';
  $('#evFilter').style.display = total? 'flex':'none';
  $('#evFilter').innerHTML =
    `<button class="chip ${S.filter==='all'?'is-on':''}" data-f="all">全部 ${total}</button>`+
    ORDER.map(t=>`<button class="chip ${S.filter===t?'is-on':''}" data-f="${t}">${TYPES[t].label} ${counts[t]}</button>`).join('');

  // 事件列表 / 空态
  const list = S.events.filter(e=>e.type!=='focus' && (S.filter==='all'||e.type===S.filter));
  const box=$('#evList');
  if(!list.length){
    const need = S.filter==='all' ? ORDER : [S.filter];
    box.innerHTML = need.map(emptyCard).join('');
  }else{
    const sorted=list.slice().sort((a,b)=>{
      const va=evView(a), vb=evView(b);
      return (parseInt(String(vb.main).replace(/,/g,''))||0)-(parseInt(String(va.main).replace(/,/g,''))||0);
    });
    box.innerHTML = sorted.map(evCard).join('');
    if(S.filter==='all' && total<3){
      const missing=ORDER.filter(t=>!counts[t]).slice(0,2);
      box.innerHTML += missing.map(emptyCard).join('');
    }
  }

  // 时间模块（5 个紧凑块，始终在首屏）
  $('#modGrid').innerHTML = ['node','count','anniv','goal','focus'].map(k=>{
    const T=TYPES[k];
    const n = k==='focus'? 0 : counts[k];
    return `<button class="tile ${k==='focus'?'live':''}" data-mod="${k}" aria-label="${T.label}">
      <span class="ti">${icon(T.ic,20)}</span>
      <span class="tl">${T.label}</span>
      ${n? `<span class="tn">${n}</span>`:''}
    </button>`;
  }).join('');
}

  }
  box.classList.remove('nomask');

  const list = k==='all'? S.events : S.events.filter(e=>e.type===k);
  let html='';

  if(k==='node'){
    html+=`<p class="flabel" style="margin:2px 0 7px">从这些常见节点开始</p>

    html+=`<div class="sec" style="margin:2px 0 8px"><h2 style="font-size:16px">${TYPES[k].label}<small>${list.length} 个</small></h2></div>`;
  }

  const ordered = k==='all'? list.slice().sort((a,b)=>(a.date||'')<(b.date||'')?1:-1) : list;
  html += list.length? `<div class="evlist">${ordered.map(evCard).join('')}</div>`

  if(k==='node'){

      <p style="margin:0;font-size:11.5px;line-height:1.65;color:var(--ink2)">
        节点不是 KPI。它只回答一个问题：<b style="font-weight:600;color:var(--brand2)">这些年，我把时间换成了什么。</b>
        已发生的记「天前」，还没到的记「天后」。</p></div>`;
  }
  box.innerHTML=html;

function bindFocus(){
  const arc=$('#fArc');
  if(!arc) return;
  function paint(){
    $('#fTime').textContent=String(Math.floor(focusLeft/60)).padStart(2,'0')+':'+String(focusLeft%60).padStart(2,'0');
    arc.style.strokeDashoffset = 603*(1-focusLeft/focusTotal);
    $('#fLab').textContent = focusRunning? '专注中 · 别切走' : (focusLeft===focusTotal? '准备开始':'已暂停');
    $('#fStart').textContent = focusRunning? '暂停' : (focusLeft===focusTotal? '开始专注':'继续');
  }
  paint();
  $$('#fPick .chip').forEach(c=>{
    c.onclick=()=>{
      if(focusRunning){ toast('先暂停再改时长'); return; }
      $$('#fPick .chip').forEach(x=>x.classList.toggle('is-on',x===c));
      focusTotal=focusLeft=+c.dataset.min*60; paint();
    };
  });
  $('#fStart').onclick=()=>{
    focusRunning=!focusRunning;
    if(focusRunning){
      buzz(10);
      focusTimer=setInterval(()=>{
        focusLeft--;
        if(focusLeft<=0){
          clearInterval(focusTimer); focusRunning=false;
          focusDay += focusTotal/60; focusLeft=focusTotal;
          toast('这一段完成了 · '+focusTotal/60+' 分钟');
          renderMod(); return;
        }
        paint();
      },1000);
    }else{ clearInterval(focusTimer); }
    paint();
  };
}

    {ic:'timer',t:'每天可奋斗',d:'决定第二个沙漏的大小',v:S.freeH+' 小时',act:'time'},
    {ic:'atom',t:'重新走一遍引导',d:'三个数值重新设置一次',v:icon('arrow',14),act:'redo'}
  ].map(r=>`<button class="row" data-act="${r.act}">
    <span class="ri">${icon(r.ic,15)}</span><span class="rt"><b>${esc(r.t)}</b><small>${esc(r.d)}</small></span>
    <span class="rv">${r.v}</span></button>`).join('');
  $('#meRows2').innerHTML=[
    {ic:'book',t:'载入示例数据',d:'6 个事件，看多卡片滑动的样子',v:icon('arrow',14),act:'seed'},
    {ic:'bell',t:'清空所有事件',d:'回到第一次打开的空态',v:icon('arrow',14),act:'clear'},
    {ic:'check',t:'减少动效',d:'停掉数字滚动与沙子流动',v:S.rm?'已开启':'已关闭',act:'rm'}
  ].map(r=>`<button class="row" data-act="${r.act}">
    <span class="ri">${icon(r.ic,15)}</span><span class="rt"><b>${esc(r.t)}</b><small>${esc(r.d)}</small></span>
    <span class="rv">${r.v}</span></button>`).join('');
}

/* ================= 弹层 ================= */
function sheetOn(){ $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); }
function sheetOff(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }

let draft={type:'node',title:'',date:'',age:'',note:'',target:'',unit:'本'};

function openCreate(type,pre){
  let t=type||'node'; if(t==='focus') t='count';
  draft={type:t,title:(pre&&pre.title)||'',date:'',age:(pre&&pre.age!==undefined?String(pre.age):''),
    note:'',target:'',unit:'本'};
  renderCreate(); sheetOn();
}
function addYears(y){
  const b=dOf(S.birth); b.setFullYear(b.getFullYear()+(+y||0)); return iso(b);
}
function renderCreate(){
  const t=draft.type;
  const ph={node:'例如：考上理想的大学',count:'例如：带爸妈去趟西藏',anniv:'例如：和她在一起',goal:'例如：读完 24 本书'}[t];
  $('#shBody').innerHTML=`
    <div class="sh-head"><div><h2>新建一件事</h2><p>先选类型，再给它一个时间</p></div></div>
    <div class="chips" style="margin:0 -20px 14px;padding:0 20px">
      ${ORDER.map(k=>`<button class="chip ${k===t?'is-on':''}" data-ct="${k}">${icon(TYPES[k].ic,13)} ${TYPES[k].label}</button>`).join('')}
    </div>
    <div class="field"><label class="flabel" for="ciTitle">标题</label>
      <input class="input" id="ciTitle" placeholder="${ph}" value="${esc(draft.title)}"></div>
    ${t==='node'?`
      <div class="field"><label class="flabel" for="ciAge">发生在几岁（按生日自动换算）</label>
        <input class="input" id="ciAge" type="number" min="0" max="100" placeholder="18" value="${esc(draft.age)}"></div>
      <div class="field"><label class="flabel" for="ciDate">或者直接选日期（可选）</label>
        <input class="input" id="ciDate" type="date" value="${esc(draft.date)}"></div>`
    : t==='goal'?`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
        <div class="field"><label class="flabel" for="ciTarget">目标值</label>
          <input class="input" id="ciTarget" type="number" min="1" placeholder="24" value="${esc(draft.target)}"></div>
        <div class="field"><label class="flabel" for="ciUnit">单位</label>
          <input class="input" id="ciUnit" placeholder="本" value="${esc(draft.unit)}"></div>
      </div>
      <div class="field"><label class="flabel" for="ciDate">截止日期</label>
        <input class="input" id="ciDate" type="date" value="${esc(draft.date)}"></div>`
    :`
      <div class="field"><label class="flabel" for="ciDate">${t==='count'?'目标日期':'纪念日是哪天'}</label>
        <input class="input" id="ciDate" type="date" value="${esc(draft.date)}"></div>`}
    <div class="field"><label class="flabel" for="ciNote">备注（可选）</label>
      <textarea class="input" id="ciNote" placeholder="写给未来的自己…">${esc(draft.note)}</textarea></div>
    <button class="btn" id="ciSave">保存</button>`;

  const bind=(id,key)=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{ draft[key]=el.value; syncSave(); });
  };
  bind('ciTitle','title'); bind('ciAge','age'); bind('ciDate','date');
  bind('ciTarget','target'); bind('ciUnit','unit'); bind('ciNote','note');

  $$('#shBody [data-ct]').forEach(b=>{
    b.onclick=()=>{ draft.type=b.dataset.ct; renderCreate(); };
  });
  syncSave();
  $('#ciSave').onclick=saveDraft;
}
function syncSave(){
  const s=$('#ciSave'), el=$('#ciTitle');
  if(!s||!el) return;
  const ok=!!el.value.trim();
  s.disabled=!ok; s.style.opacity=ok?1:.4;
}
function saveDraft(){
  const title=($('#ciTitle').value||'').trim(); if(!title) return;
  let date=draft.date;
  if(draft.type==='node'){
    if(draft.age!=='' && draft.age!=null) date=addYears(draft.age);
    else if(!date) date=iso(today);
  }
  if(!date) date=iso(new Date(today.getTime()+30*DAY));
  const e={id:'e'+Date.now(), type:draft.type, title, date, note:draft.note||''};
  if(draft.type==='goal'){
    e.target=Math.max(1,+draft.target||1); e.current=0; e.unit=draft.unit||'本';
  }
  S.events.unshift(e); save(); sheetOff(); buzz(12);
  if(!TABS.includes(cur)) cur='home';
  renderHome(); renderMe();
  if($('.page[data-p="mod"]').classList.contains('on')) renderMod();
  toast('已记下「'+title+'」');
}

function openStage(){
  const c=calc();
  const stages=[{a:c.age,n:'还在读书',d:'按你现在的年龄'},{a:25,n:'刚进职场',d:'25 岁上下'},
    {a:32,n:'职场中坚',d:'32 岁上下'},{a:60,n:'退休前后',d:'60 岁上下'}];
  $('#shBody').innerHTML=`
    <div class="sh-head"><div><h2>你正在人生的哪一段</h2><p>选一个，剩余天数立刻重算</p></div></div>
    ${stages.map(s=>`<button class="opt ${s.a===c.age?'is-sel':''}" data-age="${s.a}">
      <span class="oi">${icon('sparkle',16)}</span>
      <span class="ot"><b>${esc(s.n)} · ${s.a} 岁</b><small>${esc(s.d)}</small></span>
      <span class="tick">${icon('check',12)}</span></button>`).join('')}
    <p style="margin:14px 0 0;font-size:11px;line-height:1.6;color:var(--ink4)">
      年龄由出生日期推算。选这里会同步调整出生年份，保证全局数字一致。</p>`;
  $$('#shBody .opt').forEach(o=>{
    o.onclick=()=>{
      const age=+o.dataset.age, b=dOf(S.birth);
      b.setFullYear(new Date().getFullYear()-age);
      S.birth=iso(b);
      save(); sheetOff(); renderHome(); renderMe(); buzz(8);
      toast('已切到 '+age+' 岁');
    };
  });
  sheetOn();
}

function openTime(){
  const c=calc();
  $('#shBody').innerHTML=`
    <div class="sh-head"><div><h2>可奋斗时间</h2><p>每天真正能自由支配的小时</p></div></div>
    <div style="display:flex;gap:14px;align-items:center;padding:4px 0 10px">
      <div style="position:relative;flex:0 0 104px">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="45" fill="none" stroke="#E9DAC6" stroke-width="9"/>
          <circle cx="52" cy="52" r="45" fill="none" stroke="#85552F" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="283" stroke-dashoffset="${283*(1-Math.min(1,S.freeH/14))}" transform="rotate(-90 52 52)"/>
        </svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
          <div><div id="tHr" style="font-family:var(--serif);font-size:21px;font-weight:600;color:var(--brand2);line-height:1">${S.freeH}</div>
          <div style="font-size:9.5px;color:var(--ink3);margin-top:2px">小时/天</div></div>
        </div>
      </div>
      <div style="flex:1">
        <p style="margin:0;font-size:12px;color:var(--ink2)">一生可奋斗</p>
        <p style="margin:2px 0 0;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--brand2);line-height:1.1">
          <span id="tAll">${fmt(c.freeHours)}</span><span style="font-size:12px;font-family:var(--sans);color:var(--ink3);margin-left:3px">小时</span></p>
        <p style="margin:4px 0 0;font-size:11px;color:var(--ink3)">≈ <span id="tDays">${fmt(c.freeHours/24)}</span> 个完整日夜</p>
      </div>
    </div>
    <input class="rng" id="hrRange" type="range" min="1" max="14" step="1" value="${S.freeH}"
      style="--p:${(S.freeH-1)/13*100}%" aria-label="每天可奋斗小时">
    <div class="rng-val" style="font-size:11px"><span>1 小时</span><span>14 小时</span></div>
    <p class="flabel" style="margin:16px 0 6px">预计寿命</p>
    <div class="seg" id="lifeSeg">
      ${[75,80,87,90].map(v=>`<button data-life="${v}" class="${v===S.life?'is-on':''}">${v} 岁</button>`).join('')}
    </div>
    <p style="margin:12px 0 0;font-size:11px;line-height:1.65;color:var(--ink4)">
      剩余 <span id="tLeft">${fmt(c.left)}</span> 天 × 每天 <span id="tHr2">${S.freeH}</span> 小时 = <span id="tAll2">${fmt(c.freeHours)}</span> 小时。改任一参数，首页两个沙漏一起变。</p>`;
  const r=$('#hrRange');
  r.addEventListener('input',e=>{
    e.target.style.setProperty('--p',((e.target.value-1)/13*100)+'%');
    S.freeH=+e.target.value;
    const cc=calc();
    $('#tHr').textContent=S.freeH;
    $('#tAll').textContent=fmt(cc.freeHours);
    $('#tDays').textContent=fmt(cc.freeHours/24);
    $('#tHr2').textContent=S.freeH;
    $('#tAll2').textContent=fmt(cc.freeHours);
    $('#tLeft').textContent=fmt(cc.left);
    save(); fillHero();
  });
  $$('#lifeSeg button').forEach(b=>{
    b.onclick=()=>{ S.life=+b.dataset.life; save(); openTime(); fillHero(); };
  });
  sheetOn();
}

function openSettings(){
  const rows=[
    {k:'rm',t:'减少动效',d:'停掉数字滚动与沙子流动',on:!!S.rm},
    {k:'buzz',t:'轻震反馈',d:'保存、切换时轻微震动',on:true},
    {k:'badge',t:'每日提醒',d:'21:30 提醒看一眼还剩多少',on:true}
  ];
  $('#shBody').innerHTML=`
    <div class="sh-head"><div><h2>设置</h2><p>显示与反馈</p></div></div>
    ${rows.map(s=>`<div class="row" style="padding:12px 2px;border-bottom:1px solid var(--line2)">
      <span class="rt"><b>${s.t}</b><small>${s.d}</small></span>
      <button class="sw" data-sw="${s.k}" aria-label="${s.t}" aria-pressed="${s.on}"
        style="width:46px;height:27px;border-radius:14px;border:0;padding:0;position:relative;flex:0 0 46px;
        background:${s.on?'var(--brand)':'#E2D3BF'};transition:.22s;cursor:pointer">
        <span style="position:absolute;top:3px;left:${s.on?'22px':'3px'};width:21px;height:21px;
          border-radius:50%;background:#FFFDF9;transition:.22s;box-shadow:0 1px 3px rgba(60,40,20,.25)"></span>
      </button></div>`).join('')}
    <button class="btn ghost" id="setRedo" style="margin-top:16px">重新设置三个数值</button>`;
  $$('#shBody .sw').forEach(sw=>{
    sw.onclick=()=>{
      const on = sw.getAttribute('aria-pressed')==='true';
      const next = !on;
      if(sw.dataset.sw==='rm'){ S.rm=next; document.documentElement.classList.toggle('rm',S.rm); save(); }
      sw.setAttribute('aria-pressed',String(next));
      sw.style.background = next? 'var(--brand)':'#E2D3BF';
      sw.firstElementChild.style.left = next? '22px':'3px';
      toast(next?'已开启':'已关闭');
      if(sw.dataset.sw==='rm' && cur==='me') renderMe();
    };
  });
  $('#setRedo').onclick=()=>{
    sheetOff(); obStep=0; obTmp.birth=S.birth; obTmp.life=S.life; obTmp.freeH=S.freeH;
    renderOb(); show('ob');
  };
  sheetOn();
}

function openEvent(id){
  const e=S.events.find(x=>x.id===id); if(!e) return;
  const v=evView(e);
  $('#shBody').innerHTML=`
    <div class="sh-head"><div><h2>${esc(e.title)}</h2><p>${TYPES[e.type].label} · ${esc(e.date)}</p></div></div>
    <div style="display:flex;align-items:baseline;gap:6px;padding:6px 0 14px;border-bottom:1px solid var(--line2)">
      <span style="font-family:var(--serif);font-size:40px;font-weight:600;color:var(--brand2);line-height:1">${v.main}</span>
      <span style="font-size:13px;color:var(--ink2)">${v.unit}</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--ink3)">${esc(v.sub)}</span>
    </div>
    ${e.note?`<p style="margin:14px 0 0;font-size:13px;line-height:1.7;color:var(--ink)">${esc(e.note)}</p>`:''}
    <div style="display:flex;gap:9px;margin-top:18px">
      <button class="btn ghost" id="evDel" style="margin-top:0">删除</button>
      <button class="btn" id="evClose" style="margin-top:0">知道了</button>
    </div>`;
  $('#evClose').onclick=sheetOff;
  $('#evDel').onclick=()=>{
    S.events=S.events.filter(x=>x.id!==id); save(); sheetOff();
    renderHome(); renderMe();
    if($('.page[data-p="mod"]').classList.contains('on')) renderMod();
    toast('已删除');
  };
  sheetOn();
}

/* ================= 导航 ================= */
const TABS=['home','community','msg','me'];
let cur='ob';

function show(p){
  cur=p;
  $$('.page').forEach(el=>el.classList.toggle('on', el.dataset.p===p));
  $('#tabbar').style.display = (p==='ob')? 'none':'grid';
  $$('.tab').forEach(t=>t.classList.toggle('is-on', t.dataset.tab===p));
}

function switchTab(t){
  if(t==='create'){ openCreate('node'); return; }
  show(t);
  if(t==='home') renderHome();
  if(t==='community') renderCommunity();
  if(t==='msg') renderMsg();
  if(t==='me') renderMe();
  const sc=$('.scroll', $('.page[data-p="'+t+'"]'));
  if(sc) sc.scrollTop=0;
}

function goBack(){
  if($('#sheet').classList.contains('on')){ sheetOff(); return; }
  if(cur==='post'||cur==='topic'){ show('community'); renderCommunity(); return; }
  if(cur==='mod'){ show('home'); renderHome(); return; }
  show('home'); renderHome();
}

/* ================= 交互委托 ================= */
document.addEventListener('click',function(ev){
  const el=ev.target;

  const tab=el.closest('.tab');
  if(tab){ buzz(6); switchTab(tab.dataset.tab); return; }

  if(el.closest('[data-back]')){ goBack(); return; }

  const f=el.closest('[data-f]');
  if(f){ S.filter=f.dataset.f; renderHome(); return; }

  const pfil=el.closest('[data-pfil]');
  if(pfil){
    postFilter=pfil.dataset.pfil;
    $$('#pfilRow .chip').forEach(b=>b.classList.toggle('is-on',b===pfil));
    renderCommunity(); return;
  }

  const nw=el.closest('[data-new]');
  if(nw){ openCreate(nw.dataset.new); return; }

  const evc=el.closest('[data-ev]');
  if(evc){ openEvent(evc.dataset.ev); return; }

  const mod=el.closest('[data-mod]');
  if(mod){ openMod(mod.dataset.mod); return; }

  const pre=el.closest('[data-preset]');
  if(pre){ const p=PRESETS[+pre.dataset.preset]; openCreate('node',{title:p.title,age:p.age}); return; }

  const hc=el.closest('.hcard');
  if(hc){
    if(hc.classList.contains('side')){ S.front=hc.dataset.k; save(); applyHero(); buzz(6); }
    else cycleUnit(hc.dataset.k);
    return;
  }

  if(el.closest('#stageBtn')){ openStage(); return; }
  if(el.closest('#timeBtn')){ openTime(); return; }
  if(el.closest('#gear')){ openSettings(); return; }
  if(el.closest('#allEv')){ openMod('all'); return; }
  if(el.closest('#modAdd')){
    if(S.mod==='focus'){ const b=$('#fStart'); if(b) b.click(); }
    else openCreate(S.mod||'node');
    return;
  }
  if(el.closest('#cmSearch')){ toast('搜索：试试「第一桶金」或「三十岁」'); return; }

  const pf=el.closest('[data-feed]');
  if(pf){
    feed=pf.dataset.feed;
    $$('#cmSeg button').forEach(b=>b.classList.toggle('is-on',b===pf));
    renderCommunity(); return;
  }

  const tp=el.closest('[data-topic]');
  if(tp){ openTopic(tp.dataset.topic); return; }
  if(el.closest('#tpJoin')){ toast('已加入话题，发布时会自动带上 '+(curTopic?'#'+curTopic:'')); return; }

  const fo=el.closest('[data-follow]');
  if(fo){
    const name=fo.dataset.follow;
    if(S.follows.includes(name)) S.follows=S.follows.filter(x=>x!==name);
    else S.follows.push(name);
    save();
    renderCommunity();
    if(cur==='topic') openTopic(curTopic);
    toast(S.follows.includes(name)?'已关注 '+name:'已取消关注');
    return;
  }

  const lk=el.closest('[data-like]');
  if(lk){
    const id=lk.dataset.like;
    if(S.likes.includes(id)) S.likes=S.likes.filter(x=>x!==id); else S.likes.push(id);
    save(); buzz(6);
    if(cur==='post') renderPost();
    else if(cur==='topic') openTopic(curTopic);
    else renderCommunity();
    return;
  }

  const cl=el.closest('[data-clike]');
  if(cl){ cl.classList.toggle('liked'); return; }

  const op=el.closest('[data-open]');
  if(op){ openPost(op.dataset.open); return; }

  const pt=el.closest('[data-post]');
  if(pt){ openPost(pt.dataset.post); return; }

  if(el.closest('#pdMore')){ toast('举报 / 不感兴趣 / 复制链接'); return; }

  const act=el.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='params'||a==='time') openTime();
    else if(a==='redo'){ obStep=0; obTmp.birth=S.birth; obTmp.life=S.life; obTmp.freeH=S.freeH; renderOb(); show('ob'); }
    else if(a==='seed'){ seedDemo(); save(); renderHome(); renderMe(); toast('已载入 6 个示例事件'); }
    else if(a==='clear'){ S.events=[]; save(); renderHome(); renderMe(); toast('已清空，回到空态'); }
    else if(a==='rm'){ S.rm=!S.rm; document.documentElement.classList.toggle('rm',S.rm); save(); renderMe(); toast(S.rm?'已开启减少动效':'已恢复完整动效'); }
    return;
  }

  if(el.closest('#scrim')){ sheetOff(); return; }
});

/* 引导 */
$('#obNext').onclick=()=>{
  if(obStep<2){ obStep++; renderOb(); buzz(6); }
  else finishOb(!S.events.length);
};
$('#obPrev').onclick=()=>{ if(obStep>0){ obStep--; renderOb(); } };
$('#obSkip').onclick=()=>{ obTmp.birth=S.birth; obTmp.life=S.life; obTmp.freeH=S.freeH; finishOb(false); };

/* 评论 */
$('#pdInput').addEventListener('input',e=>{ $('#pdSend').disabled=!e.target.value.trim(); });
$('#pdSend').onclick=()=>{
  const v=$('#pdInput').value.trim(); if(!v||!curPost) return;
  const p=POSTS.find(x=>x.id===curPost);
  CMTS[curPost]=CMTS[curPost]||(p.comments||[]).slice();
  CMTS[curPost].push({name:'我',av:'a',text:v,when:'刚刚',likes:0});
  $('#pdInput').value=''; $('#pdSend').disabled=true;
  renderPost(); buzz(8); toast('评论已发布');
  const sc=$('#pdScroll'); if(sc) sc.scrollTop=sc.scrollHeight;
};
$('#pdInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#pdSend').click(); } });

document.addEventListener('keydown',e=>{ if(e.key==='Escape') goBack(); });

function ensurePostFilter(){
  if($('#pfilRow')) return;
  const seg=$('#cmSeg');
  const row=document.createElement('div');
  row.id='pfilRow'; row.className='chips';
  row.style.margin='9px -20px 0'; row.style.padding='0 20px';
  row.innerHTML=`<button class="chip is-on" data-pfil="all">全部</button>
    <button class="chip" data-pfil="log">事件日志</button>
    <button class="chip" data-pfil="mood">心情随笔</button>`;
  seg.parentNode.insertBefore(row, seg.nextSibling);
}

/* ================= 初始化 ================= */
function init(){
  const seen=load();
  document.documentElement.classList.toggle('rm',!!S.rm);
  if(!S.filter) S.filter='all';
  obTmp.birth=S.birth; obTmp.life=S.life; obTmp.freeH=S.freeH;
  if(!S.followInit){ S.follows=POSTS.filter(p=>p.follow).map(p=>p.name); S.followInit=true; save(); }
  ensurePostFilter();
  if(seen){
    renderHome(); renderCommunity(); renderMsg(); renderMe(); show('home');
  }else{
    obStep=0; renderOb(); show('ob');
  }
}
init();

</script>
</body>
